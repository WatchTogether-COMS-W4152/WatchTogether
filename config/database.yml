# Development and test use SQLite (zero setup). Production uses PostgreSQL.

sqlite: &sqlite
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *sqlite
  database: storage/development.sqlite3

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *sqlite
  database: storage/test.sqlite3

# Production uses PostgreSQL. Connection details come from DATABASE_URL
# (set automatically by Heroku Postgres), which Rails merges into this entry,
# e.g. DATABASE_URL=postgres://user:pass@host:5432/watch_together_production
#
# Read more: https://guides.rubyonrails.org/configuring.html#configuring-a-database
production:
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  database: watch_together_production
